<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Guy Lyons">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#141920" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0c10"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family: ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace; }
    .role { font-size: 17px; fill: #c9d1d9; }
  </style>

  <rect width="900" height="300" fill="url(#fade)"/>
  <rect width="900" height="300" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="899" height="299" rx="12" fill="none" stroke="#21262d"/>

  <rect x="48" y="72" width="26" height="4" rx="2" fill="#58a6ff">
    <animate attributeName="width" values="26;46;26" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="48" y="126" font-size="42" font-weight="650" letter-spacing="-0.5" fill="#e6edf3">Guy Lyons</text>
  <text x="49" y="152" font-size="14" fill="#6e7681" class="mono">guylyons.dev</text>

  <!-- rotating roles, 4 x 3s -->
  <text class="role" x="48" y="186" opacity="0"><tspan fill="#7ee787">&gt; </tspan>native macOS apps<animate attributeName="opacity" dur="12s" begin="0s" values="0;1;1;0;0" keyTimes="0;0.05;0.22;0.27;1" repeatCount="indefinite"/></text>
  <text class="role" x="48" y="186" opacity="0"><tspan fill="#7ee787">&gt; </tspan>command-line tools in Rust<animate attributeName="opacity" dur="12s" begin="3s" values="0;1;1;0;0" keyTimes="0;0.05;0.22;0.27;1" repeatCount="indefinite"/></text>
  <text class="role" x="48" y="186" opacity="0"><tspan fill="#7ee787">&gt; </tspan>editors, Emacs and Neovim<animate attributeName="opacity" dur="12s" begin="6s" values="0;1;1;0;0" keyTimes="0;0.05;0.22;0.27;1" repeatCount="indefinite"/></text>
  <text class="role" x="48" y="186" opacity="0"><tspan fill="#7ee787">&gt; </tspan>Drupal and the web<animate attributeName="opacity" dur="12s" begin="9s" values="0;1;1;0;0" keyTimes="0;0.05;0.22;0.27;1" repeatCount="indefinite"/></text>

  <circle cx="54" cy="246" r="4.5" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="68" y="251" font-size="13.5" fill="#8b949e">probably rewriting something in Rust</text>

  <!-- numbers from the GitHub API, Oct 2026 -->
  <text x="852" y="110" text-anchor="end" font-size="21" font-weight="600" fill="#e6edf3">107</text>
  <text x="852" y="127" text-anchor="end" font-size="10.5" letter-spacing="0.6" fill="#6e7681" class="mono">PUBLIC REPOS</text>
  <line x1="668" y1="142" x2="852" y2="142" stroke="#21262d"/>
  <text x="852" y="164" text-anchor="end" font-size="21" font-weight="600" fill="#e6edf3">2015</text>
  <text x="852" y="181" text-anchor="end" font-size="10.5" letter-spacing="0.6" fill="#6e7681" class="mono">ON GITHUB SINCE</text>
  <line x1="668" y1="196" x2="852" y2="196" stroke="#21262d"/>
  <text x="852" y="218" text-anchor="end" font-size="21" font-weight="600" fill="#e6edf3">6</text>
  <text x="852" y="235" text-anchor="end" font-size="10.5" letter-spacing="0.6" fill="#6e7681" class="mono">LANGUAGES IN ROTATION</text>
</svg>
